// Volumetric Explosions settings. Change a value, save, and start a new flight.
VOLUMETRIC_EXPLOSIONS
{
	enabled = true        // false brings the stock explosions back
	quality = 1.0         // number of particles, and of steps the smoke is drawn in: 0.2 (light) to 3 (heavy)
	max_particles = 30000 // most particles alive in the scene at once: 2000 to 120000
	size = 1.0            // how big explosions are: 0.3 to 3
	smoke = 1.0           // how long smoke hangs in the air: 0 (none) to 4
	breeze = as it comes  // when there is a wind for smoke to drift on: still (never), as it comes (still nine times in ten, mostly a light air otherwise, a strong wind very rarely; or the weather mod's wind), always some
	wind = 1.0            // how strong that wind is: 0 (always still) to 4
	detail = 0.6          // how deeply the billows are cut into the edge of the smoke: 0 (smooth) to 1
	thick = 1.6           // how thick the smoke is: 0.3 (thin) to 4
	thin = 2.0            // smoke too thin to see is not drawn (a small saving): how many 255ths of what is behind it a line of sight's smoke may hide, at the very most, before any of it is drawn. 0 draws all of it; up to 8
	volume = true         // draw smoke and fire as a true volume where the game runs on OpenGL; false draws soft sprites everywhere
	half = true           // draw that volume with half as many pixels each way and enlarge it: several times less work, a little softer close up
	light = true          // explosions light up the ground and the wreck around them
	debris = true         // pieces of the destroyed parts thrown out
	shockwave = true      // the shock front of a blast, in air: it bends the picture behind it as it races outward
	bend = 1.0            // how strongly it does: 0 (not at all) to 2
	shake = true          // when a shock front reaches the camera, the camera is jolted and the whole picture gives for a moment
	sound_travels = true  // the bang is heard when its sound gets to the camera (a second for every 340 metres at sea level), as the shock front does; false: on the instant, as the game has it
	scorch = true         // burn marks on the ground
	shadows = true        // smoke throws its shadow on the ground, buildings and ships under it, in sunlight (OpenGL only, as the volume is)
	push = true           // ships and engine exhaust push smoke about
	predict = true        // the way things moving through smoke are about to go is looked ahead along, and the smoke in their way made finer before they get there
	wakes = true          // what goes through smoke leaves a tunnel in it, sharp at first, that fills in again (OpenGL only, as the volume is)
	vortices = true       // the air behind what goes through smoke is left turning and carries the smoke round: eddies behind blunt things, two tubes behind wings
	collide = true        // smoke does not pass through the ground, buildings or ships
	threads = 0           // worker threads to use: 0 picks by itself
	native = true         // make the grids with the mod's own library where there is one (far less processor time); false always uses the C# instead. The picture is the same
	log = false           // write how each explosion was read (what blew up, why, where) to KSP.log
}
