// Volumetric Explosions settings. Change a value, save, and start a new flight.
VOLUMETRIC_EXPLOSIONS
{
	enabled = true        // false brings the stock explosions back
	quality = 1.0         // number of particles, and of steps the smoke is drawn in: 0.2 (light) to 3 (heavy)
	max_particles = 30000 // most particles alive in the scene at once: 2000 to 120000
	size = 1.0            // how big explosions are: 0.3 to 3
	smoke = 1.0           // how long smoke hangs in the air: 0 (none) to 4
	breeze = as it comes  // when there is a wind for smoke to drift on: still (never), as it comes (still nine times in ten, mostly a light air otherwise, a strong wind very rarely; or the weather mod's wind), always some
	wind = 1.0            // how strong that wind is: 0 (always still) to 4
	detail = 0.6          // how deeply the billows are cut into the edge of the smoke: 0 (smooth) to 1
	thick = 1.6           // how thick the smoke is: 0.3 (thin) to 4
	thin = 2.0            // smoke too thin to see is not drawn (a small saving): how many 255ths of what is behind it a line of sight's smoke may hide, at the very most, before any of it is drawn. 0 draws all of it; up to 8
	volume = true         // draw smoke and fire as a true volume where the game runs on OpenGL; false draws soft sprites everywhere
	half = true           // draw that volume with half as many pixels each way and enlarge it: several times less work, a little softer close up
	light = true          // explosions light up the ground and the wreck around them
	debris = true         // pieces of the destroyed parts thrown out
	embers = true         // a fire on the ground sends up embers, glowing bits carried up in its heat that dim and go out
	shockwave = true      // the shock front of a blast, in air: it bends the picture behind it as it races outward
	bend = 1.0            // how strongly it does: 0 (not at all) to 2
	shake = true          // when a shock front reaches the camera, the camera is jolted and the whole picture gives for a moment
	sound_travels = true  // the bang is heard when its sound gets to the camera (a second for every 340 metres at sea level), as the shock front does; false: on the instant, as the game has it
	own_bang = true       // the bang made from the blast itself: a crack close by, a boom and a long rumble far off, as big as what went off (with sound_travels); false: the game's own two recordings
	recorded = true       // recordings of real blasts and fires heard in it, where the download has them (Sonniss's libraries); false: the roar made by the mod alone
	scorch = true         // burn marks on the ground
	shadows = true        // smoke throws its shadow on the ground, buildings and ships under it, in sunlight (OpenGL only, as the volume is)
	shaded = true         // and what stands in the sun (the craft, the tower, buildings, the ground) throws its shadow into the smoke nearest the camera
	push = true           // ships and engine exhaust push smoke about
	blasts_push = false   // a blast pushes craft, and breaks what it knocks harder than it can take (a tank's blast can take the tank beside it); it changes the game, so it is off as it comes
	predict = true        // the way things moving through smoke are about to go is looked ahead along, and the smoke in their way made finer before they get there
	wakes = true          // what goes through smoke leaves a tunnel in it, sharp at first, that fills in again (OpenGL only, as the volume is)
	vortices = true       // the air behind what goes through smoke is left turning and carries the smoke round: eddies behind blunt things, two tubes behind wings
	collide = true        // smoke does not pass through the ground, buildings or ships
	bdarmory = true       // with BD Armory: its shells, rockets, missiles and bombs go off as ours, sized by their explosive (its sound and damage stay its own); false leaves its own
	bdarmory_most = 40    // most of BD Armory's explosions a second laid as ours: past it, its own show. 0 to 400
	armory = true         // with BD Armory: its fires, leaks, missiles' and rockets' trails, guns' smoke, hits, flares, smoke screens, chaff and nukes drawn as volumes in this air (only how they look); false leaves all of them as BD Armory draws them
	armory_ours = true    // false: BD Armory's own everywhere, its explosions too, at once (what the key below flips, for setting the two side by side)
	armory_key = B        // the key that flips armory_ours in flight, with the game's modifier key held (Alt; Option on a Mac): a key's name as Unity has it (B, F9, Keypad5), or None for no key
	armory_fires = true   // each kind by itself: a burning part, a fire on the ground
	armory_leaks = true   // a holed tank's spray
	armory_missiles = true        // a missile's flame and trail
	armory_rockets = true         // an unguided rocket's trail
	armory_guns = true    // the smoke out of a gun's muzzle
	armory_hits = true    // the puff and sparks where a shot strikes, and the sparks of a craft an EMP shut down
	armory_countermeasures = true // a flare's trail, a smoke screen's cloud, chaff; on Natural Ocean's sea a bubble screen's and a sonar decoy's white water
	armory_nukes = true   // a nuke as this mod's nuclear explosion (its sound, its EMP and its damage stay BD Armory's)
	armory_splashes = true        // with Natural Ocean: its rounds' splashes into the sea, and a torpedo's track
	armory_cut = true     // BD Armory's particles hidden for ours are not worked out either while hidden (cheaper); false: only not drawn
	patches = 12          // most patches of air at once, explosions' and engines' trails together (more hold more fires and trails, at some 40 MB of memory each): 6 to 15
	gridsaframe = 3       // most grids of the smoke made in one frame, over all of it: what covers the most of the screen first, the rest the next frame. 0: as many as are due; up to 12
	threads = 0           // worker threads to use: 0 picks by itself
	fire_bright = 0.45    // how bright a fire's flames are: 0.1 to 1.5
	fire_tall = 1.5       // how tall a fire on the ground burns, against the height its width gives its flames: 0.5 to 3
	fire_tongues = 1      // the size of a fire's tongues of flame, against the fire's: 0.5 to 2
	fire_light = 8        // how strongly a fire's light falls on the smoke round it: 0 to 24
	trail_lingers = 20    // an engine's trail stays in the air so many times as long as its own smoke lasts: 1 to 60
	sea_billows = 0.5     // how deeply the billows of the water a blast at the sea throws up are cut, against smoke's (1): 0 to 1
	native = true         // make the grids with the mod's own library where there is one (far less processor time); false always uses the C# instead. The picture is the same
	log = false           // write how each explosion was read (what blew up, why, where) to KSP.log
}
